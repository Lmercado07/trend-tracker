<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Radar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f7;--surf:#fff;--ink:#14213d;--mut:#5b6678;--line:#dde2ea;--social:#6d4aff;--search:#0a8f6a;--news:#e8590c;--sel:#eaeefb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1424;--surf:#151e33;--ink:#e8edf7;--mut:#9aa6bb;--line:#26324d;--social:#9b86ff;--search:#3ccf9f;--news:#ff8a4c;--sel:#1d2a48;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Instrument Sans",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:56px 32px 96px}
h1,h2,.num{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif}
h1{font-size:42px;line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:17px;margin:0 0 36px;max-width:58ch}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.chip{font:inherit;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:9px 20px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.65;margin-left:6px}
.upd{color:var(--mut);font-size:14px;margin:0 0 32px}
.warn{color:var(--news);font-weight:600;font-size:14px;margin:0 0 24px}
:focus-visible{outline:2px solid var(--social);outline-offset:3px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:32px}.wrap{padding:32px 18px 64px}h1{font-size:34px}}
.list{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:56px 1fr;gap:18px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:22px 24px;cursor:pointer;transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--mut)}
.row[aria-current=true]{border-color:var(--ink);background:var(--sel)}
.num{font-size:32px;font-weight:700;line-height:1}
.nm{font-weight:600;font-size:17px}
.meta{color:var(--mut);font-size:14px}
.why1{color:var(--mut);font-size:14px;margin-top:6px;display:block}
.dots{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on.social{background:var(--social)}.dots i.on.search{background:var(--search)}.dots i.on.news{background:var(--news)}
.detail{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:40px;position:sticky;top:24px}
@media(max-width:820px){.detail{position:static;padding:26px}}
.detail h2{font-size:30px;line-height:1.2;margin:0 0 6px}
.lane{margin:32px 0 0}
.lane .hd{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:8px}
.lane svg{width:100%;height:76px;display:block}
.callout{margin:36px 0 0;padding:18px 22px;border-left:3px solid var(--news);background:var(--bg);border-radius:0 10px 10px 0}
.sec{font:600 13px/1.4 "Instrument Sans",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:36px 0 10px}
.why{margin:0;padding-left:20px}.why li{margin:6px 0}
.hl{margin:0;padding:0;list-style:none}
.hl li{padding:12px 0;border-top:1px solid var(--line);font-size:15px}
a{color:var(--social)}
.msg{padding:24px;color:var(--mut)}
.foot{margin-top:56px;color:var(--mut);font-size:14px;max-width:70ch}
</style>
</head>
<body>
<div class="wrap">
<h1>Trend Radar</h1>
<p class="sub">US topics ranked by how fast social chatter, search interest and news coverage are rising together. The earlier the signal, the more useful it is.</p>
<div class="bar" id="bar"></div>
<p class="upd" id="upd"></p>
<p class="warn" id="warn" hidden></p>
<div class="grid"><div class="list" id="list"></div><div class="detail" id="detail"></div></div>
<p class="foot" id="foot"></p>
</div>
<script>
const SRC=[{k:'social',n:'Social chatter (Bluesky)'},{k:'search',n:'Search interest (Google Trends)'},{k:'news',n:'News coverage'}];
let D=null,stage='All',sel=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=k=>`var(--${k})`;
const hm=s=>s?new Date(s).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
const byStage=(r,s)=>s==='All'||(s==='Not on Trends yet'?r.origin==='discovered':r.stage===s);
async function load(){
 try{const r=await fetch('data/latest.json?'+Date.now());if(!r.ok)throw 0;D=await r.json()}
 catch(e){document.getElementById('list').innerHTML='<p class="msg">No data yet. The first collection run has not finished. Check the Actions tab in your repository, then reload.</p>';document.getElementById('detail').innerHTML='';return}
 render()}
function dots(r){return`<span class="dots">${SRC.map(s=>`<i class="${s.k}${r.sig[s.k]>25?' on':''}"></i>`).join('')}</span>`}
function spark(a,k,on){const w=300,h=76,n=a.length,mx=Math.max(...a),mn=Math.min(...a),X=i=>i/Math.max(1,n-1)*w,Y=v=>h-6-(v-mn)/(mx-mn||1)*(h-14);
const p=a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
const m=on!=null?`<line x1="${X(on)}" x2="${X(on)}" y1="0" y2="${h}" stroke="${col(k)}" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`:'';
return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Recent trend">${m}<path d="${p}L${w} ${h}L0 ${h}Z" fill="${col(k)}" opacity=".12"/><path d="${p}" fill="none" stroke="${col(k)}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function render(){
 const stages=['All','Breaking','Building','Early signal','Watching','Not on Trends yet'];
 document.getElementById('bar').innerHTML=stages.map(s=>`<button class="chip" aria-pressed="${stage===s}" data-s="${s}">${s}<small>${D.topics.filter(r=>byStage(r,s)).length}</small></button>`).join('');
 document.getElementById('upd').textContent=`Updated ${hm(D.updated)} · ${D.snapshots} readings · refreshes every minute`;
 const bad=Object.entries(D.health||{}).filter(([k,v])=>v===false).map(([k])=>k.replace('_',' '));
 const w=document.getElementById('warn');w.hidden=!bad.length;w.textContent=bad.length?`⚠ Not working right now: ${bad.join(', ')}. Scores use the remaining sources.`:'';
 const m=D.meta||{};
 document.getElementById('foot').textContent=`Sources: ${m.feeds_ok??'?'} of ${m.feeds_total??'?'} news feeds reachable, Google News, Google Trends, Bluesky, and links shared on Mastodon. Scores need a few readings to settle, so the first hour is rough.`;
 const rows=D.topics.filter(r=>byStage(r,stage));
 if(!rows.find(r=>r.name===sel)&&rows.length)sel=rows[0].name;
 document.getElementById('list').innerHTML=rows.length?rows.map(r=>`<button class="row" data-n="${encodeURIComponent(r.name)}" aria-current="${r.name===sel}"><span class="num">${r.score}</span><span><span class="nm">${esc(r.name)}</span><br><span class="meta">${dots(r)}${r.stage} · ${r.confidence} confidence${r.is_new?' · new':''}</span><span class="why1">${esc((r.reasons||[])[0]||'')}</span></span></button>`).join(''):'<p class="msg">No topics here right now. Try another filter.</p>';
 const r=D.topics.find(x=>x.name===sel);
 if(!r){document.getElementById('detail').innerHTML='';return}
 let co;
 if(r.stage==='Collecting data')co='Still collecting readings for this topic. Scores settle after about an hour.';
 else if(r.lead_min!=null&&r.lead_min>0)co=`Social chatter rose <b>${r.lead_min} minutes</b> before news coverage did. Topics with this pattern are worth watching early.`;
 else if(r.stage==='Watching')co='No source is rising faster than its baseline. Nothing to act on yet.';
 else if(r.sig.news>25)co='News is already covering this alongside other signals.';
 else co='News has not picked this up yet.';
 document.getElementById('detail').innerHTML=`<h2>${esc(r.name)}</h2><div class="meta">${r.stage} · ${r.confidence} confidence · score ${r.score} of 100</div>`+
 SRC.map(s=>`<div class="lane"><div class="hd"><span style="color:${col(s.k)};font-weight:600">${s.n}</span><span class="meta">${r.onset[s.k]!=null?'rising since '+hm(r.onset_ts[s.k]):'flat'} · signal ${r.sig[s.k]}</span></div>${spark(r.series[s.k],s.k,r.onset[s.k])}</div>`).join('')+
 `<p class="callout">${co}</p><h3 class="sec">Why it’s flagged</h3><ul class="why">${r.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`+
 (r.samples.length?`<h3 class="sec">Top Bluesky posts</h3><ul class="hl">${r.samples.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a></li>`).join('')}</ul>`:'')+
 (r.headlines.length?`<h3 class="sec">Headlines</h3><ul class="hl">${r.headlines.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:'')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-s]'),w=e.target.closest('[data-n]');
 if(c){stage=c.dataset.s;render()}
 else if(w){sel=decodeURIComponent(w.dataset.n);render();if(matchMedia('(max-width:820px)').matches)document.getElementById('detail').scrollIntoView({behavior:'smooth'})}});
load();setInterval(load,60000);
</script>
</body>
</html>
